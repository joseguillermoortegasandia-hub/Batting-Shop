name: Verificar tienda y panel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@11.5.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r private/tests/requirements.txt
      - run: python -m playwright install --with-deps chrome
      - run: pnpm run verify
      - run: pnpm run test:panel
      - run: pnpm run test:browser
      - run: pnpm run test:github
      - run: pnpm run test:colors
      - run: pnpm run test:pages
      - run: pnpm audit
